name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -I tests/test_router.py
      - run: python -I tests/test_lymbix_tools.py
      - run: python -m json.tool config/default.json
      - run: python -m json.tool .claude-plugin/plugin.json
      - run: python -m json.tool .claude-plugin/marketplace.json
      - run: python -m json.tool hooks/hooks.json
      - run: git diff --no-index --exit-code llms.txt docs/llms.txt
