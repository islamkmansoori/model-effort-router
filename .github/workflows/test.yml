name: test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I tests/test_router.py
      - run: python -m json.tool config/default.json
      - run: python -m json.tool .claude-plugin/plugin.json
      - run: python -m json.tool .claude-plugin/marketplace.json
      - run: python -m json.tool hooks/hooks.json
